name: Saytni GitHub Pages'ga chiqarish

on:
  # main tarmog'iga har bir o'zgarish yuborilganda sayt qayta yig'iladi
  push:
    branches: [main]
  # GitHub'dagi Actions bo'limidan qo'lda ishga tushirish imkoni
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v7
      - name: Saytni yig'ish
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'ga chiqarish
        id: deployment
        uses: actions/deploy-pages@v5
